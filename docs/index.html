<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #131316;
      --surface-hover: #1a1a1e;
      --border: #232329;
      --text: #e8e8ea;
      --text-muted: #8a8a93;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.12);
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container { max-width: 640px; margin: 0 auto; padding: 0 1.5rem; }

    .hero {
      padding: 5rem 0 3rem;
      text-align: center;
    }

    .hero-icon {
      width: 56px; height: 56px;
      margin: 0 auto 1.5rem;
      display: block;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 0.75rem;
    }

    .hero p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 400px;
      margin: 0 auto;
    }

    .tagline {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.6875rem;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 999px;
      padding: 0.3125rem 0.75rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
    }

    .skills-list {
      list-style: none;
      padding: 0 0 3rem;
    }

    .skill-item {
      border-bottom: 1px solid var(--border);
      transition: background 200ms var(--ease-out);
    }

    .skill-item:first-child { border-top: 1px solid var(--border); }

    .skill-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 0.25rem;
      text-decoration: none;
      color: inherit;
      transition: padding-left 200ms var(--ease-out);
    }

    .skill-link:hover { padding-left: 0.75rem; }
    .skill-link:hover .skill-arrow { opacity: 1; transform: translateX(0); }

    .skill-name {
      font-family: var(--mono);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-glow);
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      flex-shrink: 0;
      min-width: 3.5rem;
      text-align: center;
    }

    .skill-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      flex-grow: 1;
    }

    .skill-auto {
      font-family: var(--mono);
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 999px;
      padding: 0.1875rem 0.5rem;
      flex-shrink: 0;
    }

    .skill-arrow {
      color: var(--text-muted);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
      flex-shrink: 0;
    }

    .search-wrap {
      max-width: 360px;
      margin: 0.5rem auto 0;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      font-family: var(--sans);
      font-size: 0.9375rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.625rem 1.125rem 0.625rem 2.625rem;
      outline: none;
      transition: border-color 200ms var(--ease-out), background 200ms var(--ease-out);
    }

    .search-wrap input::placeholder { color: var(--text-muted); }

    .search-wrap input:focus {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.9375rem;
      display: none;
    }

    footer {
      padding: 2rem 0 3rem;
      text-align: center;
    }

    footer p {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      transition: color 200ms var(--ease-out);
    }

    footer a:hover { color: var(--accent-hover); }

    @media (max-width: 768px) {
      .hero { padding: 3.5rem 0 2.5rem; }
      .skill-link { gap: 0.75rem; }
      .skill-auto { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <img src="favicon.svg" alt="" class="hero-icon" width="56" height="56" />
      <span class="tagline">Copilot &amp; Claude Code</span>
      <h1>Skills</h1>
      <p>AI coding skills and instructions, shared across both agents.</p>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Search..." aria-label="Search skills" autocomplete="off" />
      </div>
    </header>

    <ul class="skills-list" id="skills-list"></ul>
    <div class="no-results" id="no-results">No skills match your search.</div>

    <footer>
      <p><a href="https://github.com/its-ash/skills">GitHub</a></p>
    </footer>
  </div>

  <script>
    const skills = [
      { name: "design", title: "Frontend design", path: "design/SKILL.md", auto: true },
      { name: "node", title: "Node.js conventions", path: "node/SKILL.md", auto: true },
      { name: "perf", title: "Web performance audit", path: "perf/SKILL.md", auto: false }
    ];

    const list = document.getElementById("skills-list");
    const noResults = document.getElementById("no-results");
    const searchInput = document.getElementById("search");

    function render(items) {
      list.innerHTML = "";
      noResults.style.display = items.length === 0 ? "block" : "none";
      items.forEach(s => {
        const li = document.createElement("li");
        li.className = "skill-item";
        const auto = s.auto ? '<span class="skill-auto">Auto</span>' : "";
        li.innerHTML =
          '<a class="skill-link" href="' + s.path + '">' +
          '<span class="skill-name">' + s.name + "</span>" +
          '<span class="skill-title">' + s.title + "</span>" +
          auto +
          '<svg class="skill-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>' +
          "</a>";
        list.appendChild(li);
      });
    }

    render(skills);

    searchInput.addEventListener("input", e => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return render(skills);
      render(skills.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.title.toLowerCase().includes(q)
      ));
    });
  </script>
</body>
</html>
